name: Release

# 推 v* tag 就发 npm。凭据走 npm Trusted Publishing（GitHub Actions OIDC）——
# 仓库里不存 NPM_TOKEN，短时令牌由 npm 现场校验，顺带自动带上 provenance。
# npm 侧的信任关系绑定的是「仓库 + 这个文件名」，所以文件不能改名，改名要去 npm 重配。
on:
  push:
    tags: ['v*']
  # 手动跑 = 只体检不发包：npm 保存 trusted publisher 时不做任何校验，
  # 配错了要等真发版才炸。信任关系认的是这个文件名，所以探针只能长在这里
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC 令牌，缺了就退回找 NPM_TOKEN 然后失败

jobs:
  # 手动触发时只跑这个：把 OIDC 令牌拿去 npm 换发布令牌，换到了就说明信任关系配对了。
  # npm 的 oidc.js 换不到令牌时是 return undefined 不抛错，会静默退回找 NPM_TOKEN
  # 然后报 401，看不出是 trust 配错——所以显式探一次
  verify-trust:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Exchange the OIDC token for each package
        run: |
          set -euo pipefail
          idtoken=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).value')
          fail=0
          for name in walkie-notify walkie-mcp; do
            code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $idtoken" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name")
            # 换成功是 201（不是 200），body 里是真发布令牌——公开仓库的日志谁都能读，
            # 所以只摘错误信息，任何情况下都不整体打印 body
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              echo "$name: trusted publisher OK"
            else
              msg=$(node -p 'try { JSON.parse(require("fs").readFileSync("body.json", "utf8")).message ?? "" } catch { "" }')
              echo "::error::$name: token exchange returned $code ${msg} — check the trusted publisher on npmjs.com (repo lifeafter619/walkie, workflow release.yml, publish allowed)"
              fail=1
            fi
            rm -f body.json
          done
          exit $fail

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 24 而不是 22：npm 12 要求 node ^22.22.2 || ^24.15.0 || >=26，
          # setup-node 的 "22" 解析到的补丁版不一定够
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Node 22/24 自带的是 npm 10/11，不认 OIDC（trusted publishing 要 npm ≥ 11.5.1），
      # 不升的话这一步会去找不存在的 NPM_TOKEN 然后 401。钉 12：11.x 发给注册表的
      # trust/publish 请求体缺权限字段，配置信任关系时就是 400
      - run: npm install -g npm@^12
      # --ignore-scripts：见 ci.yml，npm ≥11.17 会给 better-sqlite3 造一个多余的 node-gyp rebuild
      - run: npm ci --ignore-scripts
      - run: npm test

      - name: Publish packages matching the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          # 应用自身的版本号有两处（根 package.json / src/shared/version.ts，后者被三端打包进产物，
          # 读不了文件所以只能写死）——对不上就停在这里，别让 /health 报着旧版本发出去
          root=$(node -p "require('./package.json').version")
          app=$(node -p "require('fs').readFileSync('src/shared/version.ts','utf8').match(/'([^']+)'/)[1]")
          for pair in "package.json:$root" "src/shared/version.ts:$app"; do
            if [ "${pair#*:}" != "$want" ]; then
              echo "::error::${pair%%:*} is at ${pair#*:} but tag says $want"
              exit 1
            fi
          done
          for dir in packages/walkie-cli packages/walkie-mcp; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # tag 与包版本不一致就停：否则 v0.5.0 会把上一版原封不动再发一次
            if [ "$version" != "$want" ]; then
              echo "::error::$name is at $version but tag says $want — bump the package or fix the tag"
              exit 1
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published — skipping"
              continue
            fi
            (cd "$dir" && npm publish --access public --provenance)
            echo "published $name@$version"
          done
