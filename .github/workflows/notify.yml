name: Notify (Walkie)

# 可复用通知 workflow（#15）：在 CI 结束/失败时通过 Walkie 推送。
# 用法：
#   jobs:
#     notify:
#       uses: lifeafter619/walkie/.github/workflows/notify.yml@main
#       secrets:
#         WALKIE_URL: https://walkie.example.com
#         WALKIE_API_KEY: ${{ secrets.WALKIE_API_KEY }}
#       with:
#         destination: prod-alerts
#         title: "Deploy finished"
#         body: "v2.4.0 deployed by ${{ github.actor }}"

on:
  workflow_call:
    inputs:
      destination:
        description: 'Walkie 目的地（频道/路由 ID 或 slug）'
        required: true
        type: string
      title:
        description: '通知标题'
        required: true
        type: string
      body:
        description: '通知正文'
        required: true
        type: string
      severity:
        description: 'info | success | warning | critical'
        required: false
        default: info
        type: string
      link:
        description: '通知链接（如 workflow run 页面）'
        required: false
        default: ''
        type: string
    secrets:
      WALKIE_URL:
        description: 'Walkie 站点地址（如 https://walkie.example.com）'
        required: true
      WALKIE_API_KEY:
        description: 'Agent API Key'
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Walkie notification
        # 直接打 REST 端点，不依赖已发布的 npm 包：fork 本仓库后立刻可用
        run: |
          payload=$(jq -nc \
            --arg destination "$DESTINATION" \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg severity "$SEVERITY" \
            --arg link "$LINK" \
            --arg key "walkie-action:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            '{destination:$destination,title:$title,body:$body,severity:$severity,idempotencyKey:$key}
             + (if $link == "" then {} else {url:$link} end)')
          curl --fail-with-body --silent --show-error \
            -X POST "${WALKIE_URL%/}/api/v1/notify" \
            -H "authorization: Bearer $WALKIE_API_KEY" \
            -H 'content-type: application/json' \
            -d "$payload"
        env:
          WALKIE_URL: ${{ secrets.WALKIE_URL }}
          WALKIE_API_KEY: ${{ secrets.WALKIE_API_KEY }}
          DESTINATION: ${{ inputs.destination }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          SEVERITY: ${{ inputs.severity }}
          LINK: ${{ inputs.link }}
